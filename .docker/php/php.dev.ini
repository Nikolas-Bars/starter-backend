memory_limit = 256M
post_max_size = 50M
upload_max_filesize = 50M
max_execution_time = 30
max_input_time = 60
default_socket_timeout = 60
date.timezone = UTC

; В dev opcache выключен, чтобы правки кода подхватывались без перезапуска воркеров
opcache.enable = 0
opcache.enable_cli = 0

; pcov включается только при сборе покрытия: make coverage
pcov.enabled = 0
