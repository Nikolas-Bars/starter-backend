memory_limit = 256M
post_max_size = 55M
upload_max_filesize = 55M
max_execution_time = 30
max_input_time = 60
default_socket_timeout = 60
date.timezone = UTC

expose_php = Off
display_errors = Off
log_errors = On
; Стек ошибки в логе — без значений аргументов: среди них могут оказаться ключи API и тексты сообщений
zend.exception_ignore_args = On

; Воркеры RoadRunner и сервер звонков — CLI-процессы, поэтому opcache нужен и для CLI.
; Код в образе не меняется: проверять время изменения файлов незачем
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
