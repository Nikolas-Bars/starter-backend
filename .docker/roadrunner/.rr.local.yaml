version: '3'

rpc:
  listen: 'tcp://127.0.0.1:6001'

server:
  command: "php vendor/bin/rr-worker start --laravel-path=/var/www/html --worker-mode=http"
  relay: "pipes"
  relay_timeout: "20s"
  env:
    - APP_BASE_PATH: "/var/www/html"

http:
  address: 0.0.0.0:80
  # МБ: файл в чат до 50 МБ плюс поля формы
  max_request_size: 60
  pool:
    num_workers: 2
    # Воркер пересоздаётся после каждого запроса — в dev правки кода видны сразу
    max_jobs: 1
    allocate_timeout: 30s
    destroy_timeout: 30s
    supervisor:
      exec_ttl: 30s
  static:
    dir: public
    forbid: [".php", ".htaccess"]
  middleware: ["headers", "gzip", "static"]

logs:
  mode: development
  level: warn
  encoding: console
