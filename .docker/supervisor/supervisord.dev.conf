[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# Сокет для supervisorctl: make ws-restart перезапускает сервер звонков после правок кода
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:roadrunner]
command=/usr/local/bin/rr serve -c /var/www/html/.docker/roadrunner/.rr.local.yaml -w /var/www/html
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
startretries=10
stopasgroup=true

# WebSocket-сервер сигнализации видеозвонков (порт 8091). Долгоживущий процесс:
# изменения кода подхватываются только после перезапуска — make ws-restart
[program:call-ws]
command=php /var/www/html/artisan call:ws-serve
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=3
startretries=10
stopsignal=TERM
stopasgroup=true

[program:worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --queue=default,media --timeout=900
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
startretries=10
stopasgroup=true

[program:schedule]
command=php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=5
startretries=10
stopasgroup=true
